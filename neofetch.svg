  <rect x="112" y="617" width="18" height="18" rx="3" fill="#79c0ff" stroke="#30363d" stroke-width="0.5" opacity="0"><set attributeName="opacity" to="1" begin="2.16s" fill="freeze"/></rect>
  <rect x="134" y="617" width="18" height="18" rx="3" fill="#d2a8ff" stroke="#30363d" stroke-width="0.5" opacity="0"><set attributeName="opacity" to="1" begin="2.16s" fill="freeze"/></rect>
