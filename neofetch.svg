  <text class="line" x="24" y="532"><tspan class="key">Commits</tspan><tspan class="dots"> ........... </tspan><tspan class="val">467+</tspan><set attributeName="opacity" to="1" begin="1.84s" fill="freeze"/></text>
  <text class="line" x="24" y="552"><tspan class="key">Client Ships</tspan><tspan class="dots"> ...... </tspan><tspan class="val">9 end-to-end</tspan><set attributeName="opacity" to="1" begin="1.92s" fill="freeze"/></text>
  <text class="line" x="24" y="572"><tspan class="key">Best Score</tspan><tspan class="dots"> ........ </tspan><tspan class="val">GAIA benchmark 20/20</tspan><set attributeName="opacity" to="1" begin="2.0s" fill="freeze"/></text>
