<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 518 660" width="518" height="660">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <style>
    .line {
      font-family: "JetBrains Mono","Fira Code","Cascadia Code","SF Mono","Menlo",Consolas,monospace;
      font-size: 14px;
      fill: #c9d1d9;
      opacity: 0;
    }
    .key { fill: #58a6ff; font-weight: bold; }
    .val { fill: #c9d1d9; }
    .dots { fill: #484f58; }
    .link { fill: #39d353; }
    .section { fill: #bc8cff; font-weight: bold; }
    .prompt-user { fill: #3fb950; font-weight: bold; }
    .prompt-host { fill: #3fb950; font-weight: bold; }
    .prompt-at { fill: #c9d1d9; }
    .prompt-colon { fill: #c9d1d9; }
    .prompt-tilde { fill: #58a6ff; font-weight: bold; }
    .prompt-dollar { fill: #c9d1d9; }
    .prompt-cmd { fill: #c9d1d9; }
    .sep { fill: #484f58; }
  </style>

  <!-- Outer shell -->
  <rect width="518" height="660" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect width="518" height="660" rx="12" fill="url(#glow)"/>

  <!-- Title bar -->
  <rect width="518" height="36" rx="12" fill="#161b22"/>
  <rect x="0" y="24" width="518" height="12" fill="#161b22"/>
  <line x1="0" y1="36" x2="518" y2="36" stroke="#30363d" stroke-width="0.5"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="18" r="6.5" fill="#f85149"/>
  <circle cx="44" cy="18" r="6.5" fill="#d29922"/>
  <circle cx="66" cy="18" r="6.5" fill="#3fb950"/>

  <!-- Title -->
  <text x="259" y="22" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" fill="#484f58"
    font-weight="500">olamilekan@github: ~</text>

  <!-- Blinking cursor -->
  <rect x="24" y="56" width="8" height="14" fill="#3fb950" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text class="line" x="24" y="72"><tspan class="prompt-green">olamilekan</tspan><tspan class="prompt-dim">@</tspan><tspan class="prompt-green">github</tspan><tspan class="prompt-dim">:</tspan><tspan class="prompt-blue">~</tspan><tspan class="prompt-dim">$ </tspan><tspan class="prompt-text">neofetch</tspan><set attributeName="opacity" to="1" begin="0.0s" fill="freeze"/></text>
  <text class="line" x="24" y="92"> <set attributeName="opacity" to="1" begin="0.08s" fill="freeze"/></text>
  <text class="line" x="24" y="112"><tspan class="prompt-user">olamilekan</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-user">github</tspan><set attributeName="opacity" to="1" begin="0.16s" fill="freeze"/></text>
  <text class="line" x="24" y="132"><tspan class="sep">──────────────────────────────────</tspan><set attributeName="opacity" to="1" begin="0.24s" fill="freeze"/></text>
  <text class="line" x="24" y="152"><tspan class="key">OS</tspan><tspan class="dots"> ................ </tspan><tspan class="val">Human 1.0 (Nigeria)</tspan><set attributeName="opacity" to="1" begin="0.32s" fill="freeze"/></text>
  <text class="line" x="24" y="172"><tspan class="key">Role</tspan><tspan class="dots"> .............. </tspan><tspan class="val">AI Automation Engineer</tspan><set attributeName="opacity" to="1" begin="0.4s" fill="freeze"/></text>
  <text class="line" x="24" y="192"><tspan class="key">Uptime</tspan><tspan class="dots"> ............ </tspan><tspan class="val">1yr 10mo on GitHub</tspan><set attributeName="opacity" to="1" begin="0.48s" fill="freeze"/></text>
  <text class="line" x="24" y="212"><tspan class="key">Editor</tspan><tspan class="dots"> ............ </tspan><tspan class="val">Claude Code, VS Code</tspan><set attributeName="opacity" to="1" begin="0.56s" fill="freeze"/></text>
  <text class="line" x="24" y="232"> <set attributeName="opacity" to="1" begin="0.64s" fill="freeze"/></text>
  <text class="line" x="24" y="252"><tspan class="key">Languages</tspan><tspan class="dots"> ......... </tspan><tspan class="val">Python, TypeScript, Java, JS</tspan><set attributeName="opacity" to="1" begin="0.72s" fill="freeze"/></text>
  <text class="line" x="24" y="272"><tspan class="key">Speaks</tspan><tspan class="dots"> ............ </tspan><tspan class="val">English, Yoruba, Pidgin</tspan><set attributeName="opacity" to="1" begin="0.8s" fill="freeze"/></text>
  <text class="line" x="24" y="292"> <set attributeName="opacity" to="1" begin="0.88s" fill="freeze"/></text>
  <text class="line" x="24" y="312"><tspan class="key">AI</tspan><tspan class="dots"> ................ </tspan><tspan class="val">Claude API, smolagents, n8n</tspan><set attributeName="opacity" to="1" begin="0.96s" fill="freeze"/></text>
  <text class="line" x="24" y="332"><tspan class="key">Infra</tspan><tspan class="dots"> ............. </tspan><tspan class="val">PostgreSQL, Docker, AWS</tspan><set attributeName="opacity" to="1" begin="1.04s" fill="freeze"/></text>
  <text class="line" x="24" y="352"><tspan class="key">Web</tspan><tspan class="dots"> ............... </tspan><tspan class="val">Node.js, Spring Boot</tspan><set attributeName="opacity" to="1" begin="1.12s" fill="freeze"/></text>
  <text class="line" x="24" y="372"> <set attributeName="opacity" to="1" begin="1.2s" fill="freeze"/></text>
  <text class="line" x="24" y="392"><tspan class="section">Contact</tspan><set attributeName="opacity" to="1" begin="1.28s" fill="freeze"/></text>
  <text class="line" x="24" y="412"><tspan class="key">Email</tspan><tspan class="dots"> ............. </tspan><tspan class="link">olamibusari607@gmail.com</tspan><set attributeName="opacity" to="1" begin="1.36s" fill="freeze"/></text>
  <text class="line" x="24" y="432"><tspan class="key">Website</tspan><tspan class="dots"> ........... </tspan><tspan class="link">hexaaiagency.com</tspan><set attributeName="opacity" to="1" begin="1.44s" fill="freeze"/></text>
  <text class="line" x="24" y="452"><tspan class="key">npm</tspan><tspan class="dots"> ............... </tspan><tspan class="val">quorum-api</tspan><set attributeName="opacity" to="1" begin="1.52s" fill="freeze"/></text>
  <text class="line" x="24" y="472"> <set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/></text>
  <text class="line" x="24" y="492"><tspan class="section">GitHub</tspan><set attributeName="opacity" to="1" begin="1.68s" fill="freeze"/></text>
